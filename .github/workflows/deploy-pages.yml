name: Deploy DES website to GitHub Pages

on:
  push:
    branches:
      - main
      - ccr-087124cb-5qkddn
    paths:
      - "des-website/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  administration: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: des-website/package-lock.json

      - name: Install dependencies
        working-directory: des-website
        run: npm ci

      - name: Build static export
        working-directory: des-website
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Add .nojekyll
        run: touch des-website/out/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: des-website/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
