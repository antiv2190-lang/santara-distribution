<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alder &amp; Stone</title>
<style>
  :root {
    --bg: #eceef0;
    --ink: #2b2d33;
    --pill: #d9dde1;
    --dark: #0d0e12;
    --muted: #6d7078;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
  }
  .hero { position: relative; width: 100%; height: 100vh; min-height: 560px; overflow: hidden; }
  canvas#city { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* nav */
  .logo { position: absolute; top: 28px; left: 32px; display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 500; letter-spacing: -.01em; z-index: 3; }
  .logo svg { width: 20px; height: 22px; }
  .nav { position: absolute; top: 28px; right: 32px; display: flex; gap: 14px; z-index: 3; }
  .pill { display: flex; align-items: center; gap: 24px; height: 44px; padding: 0 6px 0 28px; border-radius: 999px; font-size: 13px; letter-spacing: .01em; text-transform: uppercase; border: 0; cursor: pointer; font-family: inherit; }
  .pill.light { background: var(--pill); color: var(--ink); box-shadow: inset 0 0 0 3px #e9ecee; }
  .pill.dark { background: var(--dark); color: #fff; }
  .pill .ic { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; }
  .pill.light .ic { background: #f3f5f6; }
  .pill.dark .ic { background: #23252b; }
  .dots { display: flex; gap: 4px; }
  .dots i { width: 5px; height: 5px; border-radius: 50%; background: #fff; display: block; }

  /* headline */
  h1 {
    position: absolute; top: 72px; left: 20px; z-index: 2;
    font-weight: 300; font-size: clamp(48px, 7.6vw, 108px); line-height: .94; letter-spacing: -.045em;
    pointer-events: none;
  }
  h1 .arch { display: inline-block; width: .5em; height: .6em; margin: 0 .06em -.02em; vertical-align: baseline; }

  /* bottom-left */
  .intro { position: absolute; left: 25px; bottom: 28px; z-index: 3; max-width: 260px; }
  .intro p { font-size: 12.5px; line-height: 1.4; margin-bottom: 18px; }
  .intro .row { display: flex; gap: 8px; align-items: center; }
  .btn { height: 30px; padding: 0 20px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 12px; border: 0; cursor: pointer; font-family: inherit; }
  .circ { width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--pill); display: grid; place-items: center; cursor: pointer; }
  .foot { margin-top: 14px; font-size: 9px; color: #a0a3a9; }

  /* bottom-right card */
  .card { position: absolute; right: 26px; bottom: 28px; z-index: 3; display: flex; gap: 6px; height: 106px; }
  .card .txt { width: 144px; border-radius: 18px; padding: 12px; background: rgba(255,255,255,.35); border: 1px solid #d4d7db; backdrop-filter: blur(8px); display: flex; flex-direction: column; justify-content: space-between; font-size: 9px; line-height: 1.35; }
  .card .txt .acts { display: flex; gap: 6px; }
  .card .txt .acts span { width: 30px; height: 26px; border-radius: 13px; background: #fff; display: grid; place-items: center; }
  .card .img { position: relative; width: 74px; border-radius: 18px; background: linear-gradient(160deg, #8fb7e8 0%, #cfe1f5 45%, #e9f0f7 60%, #b9c6d2 100%); overflow: hidden; }
  .card .img::after { content: ""; position: absolute; left: -10px; right: 10px; top: 44px; height: 10px; background: #f4f6f8; transform: skewY(-10deg); box-shadow: 0 10px 0 #cfd6dd; }
  .card .img b { position: absolute; right: 6px; bottom: 6px; width: 20px; height: 20px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-size: 10px; font-weight: 400; z-index: 1; }

  /* slider */
  .slider { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: none; gap: 12px; z-index: 3; }

  @media (max-width: 720px) {
    .card { display: none; }
    .pill.light { display: none; }
    h1 { top: 84px; }
  }
</style>
</head>
<body>
<section class="hero">
  <canvas id="city"></canvas>

  <div class="logo">
    <svg viewBox="0 0 20 22" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 21V10a8 8 0 0 1 16 0v11M6 21V10.5a4 4 0 0 1 8 0V21"/></svg>
    Alder &amp; Stone
  </div>

  <div class="nav">
    <button class="pill light">Start a project <span class="ic"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="1" y="1.5" width="10" height="7.5" rx="1.5"/><path d="M4 11h4"/></svg></span></button>
    <button class="pill dark">Menu <span class="ic"><span class="dots"><i></i><i></i></span></span></button>
  </div>

  <h1>
    Shaping Spaces<br>That<svg class="arch" viewBox="0 0 30 36" fill="currentColor"><path d="M0 36V15C0 6 6 0 15 0s15 6 15 15v21H20V16a5 5 0 0 0-10 0v20z"/></svg>Endure
  </h1>

  <div class="intro">
    <p>Architecture moves us when place and material speak together. We design homes, workplaces and public spaces in Copenhagen, built to last.</p>
    <div class="row">
      <button class="btn" style="height:38px;padding:0 20px">Start a Project</button>
      <button class="circ" style="width:38px;height:38px" aria-label="Grid"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor"><rect x="1.5" y="1.5" width="4" height="4"/><rect x="8.5" y="1.5" width="4" height="4"/><rect x="1.5" y="8.5" width="4" height="4"/><rect x="8.5" y="8.5" width="4" height="4"/></svg></button>
      <button class="circ" style="width:38px;height:38px;opacity:.7" aria-label="Scroll"><svg width="12" height="14" viewBox="0 0 12 14" fill="none" stroke="currentColor"><path d="M6 1v12M1.5 8.5 6 13l4.5-4.5"/></svg></button>
    </div>
    <div class="foot">* Founded in Copenhagen in 2011</div>
  </div>

  <div class="card">
    <div class="txt">
      An independent studio for homes, workplaces and public space.
      <div class="acts">
        <span><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor"><rect x="1" y="2" width="10" height="8" rx="1"/><path d="m1.5 3 4.5 3.5L10.5 3"/></svg></span>
        <span><svg width="10" height="12" viewBox="0 0 10 12" fill="none" stroke="currentColor"><path d="M5 11s4-3.4 4-6.5a4 4 0 0 0-8 0C1 7.600 5 11 5 11z"/><circle cx="5" cy="4.5" r="1.2"/></svg></span>
      </div>
    </div>
    <div class="img"><b>↗</b></div>
  </div>
</section>

<script>
(() => {
  const cv = document.getElementById('city');
  const ctx = cv.getContext('2d');
  let W, H, dpr;

  // ---- build the point cloud: dotted wireframe boxes + roads + lamp posts ----
  const pts = [];
  const STEP = 0.16;

  function line(a, b) {
    const n = Math.max(2, Math.round(Math.hypot(b[0]-a[0], b[1]-a[1], b[2]-a[2]) / STEP));
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      pts.push([a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]);
    }
  }
  // box: x,z centre, w,d footprint, h height, floors = horizontal rings
  function box(cx, cz, w, d, h, floors, y0 = 0) {
    const x0 = cx - w/2, x1 = cx + w/2, z0 = cz - d/2, z1 = cz + d/2;
    for (let f = 0; f <= floors; f++) {
      const y = y0 + h * f / floors;
      line([x0,y,z0],[x1,y,z0]); line([x1,y,z0],[x1,y,z1]);
      line([x1,y,z1],[x0,y,z1]); line([x0,y,z1],[x0,y,z0]);
    }
    const cols = Math.max(2, Math.round(w / 0.55));
    for (let i = 0; i <= cols; i++) {
      const x = x0 + w * i / cols;
      line([x,y0,z0],[x,y0+h,z0]); line([x,y0,z1],[x,y0+h,z1]);
    }
    const rows = Math.max(2, Math.round(d / 0.55));
    for (let i = 0; i <= rows; i++) {
      const z = z0 + d * i / rows;
      line([x0,y0,z],[x0,y0+h,z]); line([x1,y0,z],[x1,y0+h,z]);
    }
    // rooftop dots
    for (let x = x0 + .3; x < x1 - .1; x += .3)
      for (let z = z0 + .3; z < z1 - .1; z += .3) pts.push([x, y0 + h, z]);
  }

  // tower (stacked slabs that step out like the reference)
  for (let i = 0; i < 14; i++) {
    const grow = 1 + Math.sin(i * .45) * .08;
    box(0, 0, 3.2 * grow, 3.2 * grow, .55, 1, i * .6);
  }
  box(0, 0, 3.0, 3.0, 8.4, 14);
  // podium
  box(0, 0, 6, 6, .5, 2);

  // surrounding blocks
  const blocks = [
    [-7, -2, 4, 3, 1.4, 4], [-8.5, 2.5, 4.5, 3.5, 1.1, 3], [-4.5, 4.5, 4, 3, 1.6, 4],
    [4.8, -5, 4, 3, 2.2, 6], [8.5, -1.5, 3.8, 4, 3.6, 8], [6.2, 3.2, 3.6, 3.2, 1.5, 4],
    [8.4, 6.2, 3.6, 3, 1.1, 3], [-2, 8.2, 4.2, 3, 1.0, 3], [2.4, 7.4, 3.4, 3, 1.2, 3],
    [-4, -6.5, 3.4, 3, 1.3, 4], [3, -8.5, 4, 3, 1.1, 3], [-9.5, -6, 3, 3, 1, 3]
  ];
  blocks.forEach(b => box(...b));

  // roads
  for (let k = -14; k <= 14; k += .5) {
    pts.push([k, 0, 5.5], [k, 0, -3.8], [5.8, 0, k], [-3.4, 0, k]);
  }
  // lamp posts
  [[-6,-4.5],[-5,6],[3,-3.8],[7,-3.5],[1,5.8],[9,2],[-9,5]].forEach(([x,z]) => line([x,0,z],[x,1.5,z]));

  // ---- render ----
  const DARK = '#2b2d33';
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize); resize();

  let mx = 0, my = 0;
  addEventListener('pointermove', e => { mx = e.clientX / W - .5; my = e.clientY / H - .5; });

  const tilt = 0.75; // camera pitch
  function frame(t) {
    ctx.clearRect(0, 0, W, H);
    const rot = t * 0.00012 + mx * .5;
    const cr = Math.cos(rot), sr = Math.sin(rot);
    const cp = Math.cos(tilt + my * .1), sp = Math.sin(tilt + my * .1);
    const scale = Math.min(W / 36, H / 22);
    const cx = W * .5, cy = H * .58;
    const size = Math.max(1.3, scale * .05);

    ctx.fillStyle = DARK;
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i];
      const x = p[0] * cr - p[2] * sr;
      const z = p[0] * sr + p[2] * cr;
      const sx = cx + x * scale;
      const sy = cy + (z * sp - p[1] * cp) * scale;
      const depth = z * cp + p[1] * sp;
      ctx.globalAlpha = Math.min(1, Math.max(.35, .75 + depth * .03));
      ctx.fillRect(sx, sy, size, size);
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
